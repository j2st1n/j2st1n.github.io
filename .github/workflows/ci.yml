name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 6

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v7

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: "🖼️ Restore OG image cache"
        uses: actions/cache@v6
        with:
          path: .cache/og-images
          key: og-images-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            og-images-v1-${{ runner.os }}-

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🔬 Check Astro types"
        run: pnpm run check

      - name: "🧪 Run tests"
        run: pnpm run test

      - name: "🚀 Build the project"
        run: pnpm run build
